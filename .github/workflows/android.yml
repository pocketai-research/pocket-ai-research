name: Android APK

# Push a tag like v0.2.0 to publish a GitHub Release with the APK attached.
# Running it manually builds the APK as a downloadable workflow artifact only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - name: Download offline map packs
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run maps:download
      - run: npm run build
      - run: npx cap sync android

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret. See README, section 'Android release signing'."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            export APP_VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            export APP_VERSION_NAME="0.0.$GITHUB_RUN_NUMBER-dev"
          fi
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.p12"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/PocketAiResearch-$APP_VERSION_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PocketAiResearch-apk
          path: PocketAiResearch-*.apk

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" PocketAiResearch-*.apk --title "Pocket Ai Research $GITHUB_REF_NAME" --notes-file .github/release-notes.md
